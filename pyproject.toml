[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crypt4gh"
version = "1.8.6"
description = "GA4GH cryptographic utilities"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Frédéric Haziza", email = "silverdaz@gmail.com" }]
requires-python = ">=3.9"
# See https://packaging.python.org/discussions/install-requires-vs-requirements/
dependencies = [ # include version when needed
    "docopt-ng",
    "cryptography>=47", # for ChaCha20Poly1305.encrypt_into and decrypt_into
    "bcrypt",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",

    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    # "Operating System :: Microsoft :: Windows",

    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",

    "Intended Audience :: Science/Research",
    "Environment :: Console",

    "Programming Language :: Python :: Implementation :: CPython",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",

    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # "Programming Language :: Python :: 3.14t",
]

[project.urls]
Homepage = "https://www.github.com/EGA-archive/crypt4gh"

[project.scripts]
crypt4gh = "crypt4gh.__main__:main"
crypt4gh-keygen = "crypt4gh.keys.__main__:main"
crypt4gh-completions = "crypt4gh.completions.__main__:main"

[tool.setuptools.packages.find]
include = ["crypt4gh", "crypt4gh.*"]
namespaces = false
