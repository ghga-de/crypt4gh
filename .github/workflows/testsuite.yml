name: Testsuite

on:
  push:
    branches:
      # - master
      # - releases/*
      - '**' # cover everything
    tags-ignore:
      - '**'        # but never on tags
  pull_request: # including those from forks
  workflow_dispatch:

permissions:
  contents: read

concurrency: # a newer push cancels the older runs
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build the source distribution (the tests run on what users install)
      run: |
        pip install build
        python -m build --sdist

    - name: Install package
      run: |
        pip install dist/crypt4gh-*.tar.gz --no-cache-dir

    - name: Install bats (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install bash bats-core

    - name: Install bats (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get install -y bats

    - name: Run tests
      run: |
        bats tests
