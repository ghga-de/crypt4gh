name: Publish wheels


on:
  push:
    tags:
      - v[1-9]+.*
      - test-[0-9]+.*

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      job_python_version: "3.14"

    steps:
      - name: Checkout crypt4gh
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.job_python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.job_python_version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Create source distribution and wheel
        run:  python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/crypt4gh-*


  publish-to-testpypi:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'test-')
    needs: [build]
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/crypt4gh

    permissions:
      id-token: write

    steps:
      - name: Get artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Publish distribution to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [build]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/crypt4gh

    permissions:
      id-token: write

    steps:
      - name: Get artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
